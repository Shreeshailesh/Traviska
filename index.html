<!doctype html>
<html lang="en">


<head>
  <!-- Loaded async so the payment SDK never blocks first paint / trip loading.
       Booking.tsx only uses window.Razorpay when the user clicks Pay. -->
  <script src="https://checkout.razorpay.com/v1/checkout.js" async></script>
  <link rel="preconnect" href="https://traviska-backend.onrender.com" crossorigin />
  <link rel="dns-prefetch" href="https://traviska-backend.onrender.com" />
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#0e3820" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traviska | Curated Group Trips & Expeditions</title>

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://traviska.com" />
  <meta property="og:title" content="Traviska | Curated Group Trips & Expeditions" />
  <meta property="og:description" content="Handpicked journeys crafted for thrill, serenity, and lifelong memories." />
  <meta property="og:image" content="https://traviska.com/favicon-512x512.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Traviska | Curated Group Trips & Expeditions" />
  <meta name="twitter:description" content="Handpicked journeys crafted for thrill, serenity, and lifelong memories." />
  <meta name="twitter:image" content="https://traviska.com/favicon-512x512.png" />

  <!-- Structured Data: Organization & WebSite (Google Search Rich Results) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://traviska.com/#organization",
        "name": "Traviska",
        "url": "https://traviska.com",
        "logo": {
          "@type": "ImageObject",
          "url": "https://traviska.com/favicon-512x512.png",
          "width": 512,
          "height": 512
        }
      },
      {
        "@type": "WebSite",
        "@id": "https://traviska.com/#website",
        "url": "https://traviska.com",
        "name": "Traviska",
        "description": "Curated Group Trips & Expeditions",
        "publisher": {
          "@id": "https://traviska.com/#organization"
        }
      }
    ]
  }
  </script>
</head>

<body>
  <div id="root"></div>



  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
